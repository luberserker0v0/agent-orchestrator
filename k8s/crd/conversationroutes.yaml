apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: conversationroutes.agentorchestrator.io
  labels:
    app.kubernetes.io/part-of: agent-orchestrator
spec:
  group: agentorchestrator.io
  scope: Namespaced
  names:
    plural: conversationroutes
    singular: conversationroute
    kind: ConversationRoute
    shortNames:
      - croute
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Routable
          type: string
          jsonPath: .status.conditions[?(@.type=="Routable")].status
        - name: Current
          type: string
          jsonPath: .status.currentInstanceRef
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [conversationId]
              properties:
                conversationId:
                  type: string
                  description: AgentOrchestrator conversation being routed.
                desiredInstanceRef:
                  type: string
                  description: Migration target set by the operator; empty means keep current.
            status:
              type: object
              properties:
                currentInstanceRef:
                  type: string
                  description: OpencodeInstance name serving traffic right now.
                currentEndpoint:
                  type: string
                  description: Endpoint of the current instance (resolved by the router).
                phase:
                  type: string
                  enum: [Active, Migrating, Draining]
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                migrationHistory:
                  type: array
                  items:
                    type: object
                    required: [from, to, reason, at]
                    properties:
                      from:
                        type: string
                      to:
                        type: string
                      reason:
                        type: string
                      at:
                        type: string
                        format: date-time
