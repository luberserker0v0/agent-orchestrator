# Least-privilege role for the placement controller (Phase E1: route
# lifecycle + dry-run planning; execution arrives with Phase E2).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: placement-controller
  namespace: ao-instances
  labels:
    app.kubernetes.io/part-of: agent-orchestrator
rules:
  - apiGroups: [agentorchestrator.io]
    resources: [opencodeinstances, conversationroutes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [agentorchestrator.io]
    resources: [opencodeinstances/status, conversationroutes/status]
    verbs: [get, update, patch]
  # Read-only visibility into workloads for target selection and debugging.
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch]
  # Per-conversation volume provisioning. Retention-aware GC is owned by the
  # orchestrator cleanup policy so a missing instance cannot delete data.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create]
