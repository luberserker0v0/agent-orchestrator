# Placement controller (Phase E1: dry-run planning only).
# Run exactly 1 replica until leader election lands (Phase E2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-controller
  namespace: ao-instances
  labels:
    app.kubernetes.io/part-of: agent-orchestrator
    agentorchestrator.io/component: placement-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      agentorchestrator.io/component: placement-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agent-orchestrator
        agentorchestrator.io/component: placement-controller
    spec:
      serviceAccountName: placement-controller
      containers:
        - name: controller
          # Must match an orchestrator image tag containing the operator CLI.
          # CD publishes branch/semver tags (e.g. :main, :1.2.3) — there is no :latest tag.
          image: luberserker/agent-orchestrator:main
          command: ["node", "dist/index.js"]
          # Load the same config Secret as the orchestrator so cleanup.ownerId
          # is identical for operator-provisioned and runtime-managed PVCs.
          args: ["--config", "/app/config/agentorchestrator.json", "operator", "--namespace", "ao-instances", "--interval-ms", "15000"]
          volumeMounts:
            - name: config
              mountPath: /app/config/agentorchestrator.json
              subPath: agentorchestrator.json
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          secret:
            secretName: agent-orchestrator-config
            items:
              - key: agentorchestrator.json
                path: agentorchestrator.json
