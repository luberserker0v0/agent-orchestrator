# Cluster-scoped read access for migration target selection: nodes are
# cluster-scoped and cannot be granted by the namespaced Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: placement-controller-nodes
  labels:
    app.kubernetes.io/part-of: agent-orchestrator
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: placement-controller-nodes
  labels:
    app.kubernetes.io/part-of: agent-orchestrator
subjects:
  - kind: ServiceAccount
    name: placement-controller
    namespace: ao-instances
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: placement-controller-nodes
