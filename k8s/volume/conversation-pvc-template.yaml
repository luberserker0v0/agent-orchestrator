# Template: one instance of this PVC exists per conversation.
# Lifecycle (enforced by the orchestrator cleanup policy):
#   - Created on conversation create, named `conv-<conversationId>`.
#   - Mounted by at most one instance Pod at a time (ReadWriteOnce).
#   - Deleted immediately on explicit conversation DELETE.
#     Never deleted on migration, eviction, or idle timeout.
#   - Missing instances only remove stale routes; they do not delete storage.
#   - Owned orphan PVCs are first annotated as candidates, then removed only
#     after the full configured grace period, a second observation, no Pod
#     references, and a UID-preconditioned final ownership check.
#   - Foreign and unlabeled PVCs are never deleted.
# Replace <conv-id> with the conversation id before applying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conv-<conv-id>
  namespace: ao-instances
  labels:
    app.kubernetes.io/part-of: agent-orchestrator
    agentorchestrator.io/conversation: <conv-id>
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName intentionally unset: uses the cluster default.
  # Any RWO-capable provisioner works (single-writer by lifecycle).
