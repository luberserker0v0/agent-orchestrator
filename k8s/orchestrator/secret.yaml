# Full orchestrator config mounted as a file.
# A Secret (not a ConfigMap) because agentorchestrator.json contains API keys.
# Replace the placeholder keys below before applying. The application rejects
# CHANGEME/REPLACE_ME keys so an unedited manifest fails closed. For production, prefer
# managing this file with external-secrets, SealedSecrets, or Vault instead
# of committing real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: agent-orchestrator-config
  namespace: ao-instances
  labels:
    app.kubernetes.io/part-of: agent-orchestrator
type: Opaque
stringData:
  agentorchestrator.json: |
    {
      "server": {
        "port": 8080,
        "host": "0.0.0.0",
        "shutdownTimeoutMs": 15000,
        "apiKeys": [
          { "key": "CHANGEME-admin-secret-1234567890", "role": "admin", "name": "Admin" }
        ],
        "rbac": {
          "enabled": true
        }
      },
      "websocket": {
        "heartbeatIntervalMs": 30000,
        "idleTimeoutMs": 600000
      },
      "orchestrator": {
        "maxInstances": 10,
        "idleTimeoutMs": 600000,
        "idleSweepIntervalMs": 60000,
        "portRange": {
          "start": 30000,
          "end": 30100,
          "allowDynamicFallback": true
        },
        "defaultAgentType": "opencode-k8s",
        "runtimes": [
          {
            "id": "opencode-k8s",
            "type": "kubernetes",
            "config": {
              "image": "ghcr.io/anomalyco/opencode:1.17.8",
              "namespace": "ao-instances",
              "sessionMode": "xdg",
              "pvcStorage": "10Gi",
              "podReadyTimeoutMs": 180000
            }
          }
        ],
        "healthCheck": {
          "retries": 10,
          "intervalMs": 500,
          "clientTimeoutMs": 5000
        },
        "sse": {
          "enabled": true,
          "reconnectMaxAttempts": 10,
          "reconnectBaseMs": 1000,
          "filterHeartbeat": true
        }
      },
      "workspace": {
        "basePath": "/data/workspace",
        "enforceCanonicalConfig": true,
        "maxSizeBytes": 52428800,
        "storage": {
          "type": "local"
        }
      },
      "cluster": {
        "enabled": true,
        "namespace": "ao-instances",
        "heartbeatIntervalMs": 60000,
        "quotaFailureThreshold": 2
      }
    }
