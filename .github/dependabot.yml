version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: quarterly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
    labels:
      - dependencies
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Pinned to v1: v2 rewrote the client API (request builders, deep imports).
      # The reporter/operator/runtime use the v1 promise API surface.
      - dependency-name: "@kubernetes/client-node"
        update-types:
          - "version-update:semver-major"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "@vitest/*"
          - "eslint*"
          - "prettier"
          - "vitest*"
          - "tsx"
          - "typescript*"
          - "cross-env"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - ci
