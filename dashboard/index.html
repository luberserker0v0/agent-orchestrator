<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentOrchestrator Dashboard</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3345;
  --text: #e4e6f0;
  --text-dim: #8b8fa3;
  --accent: #6c8cff;
  --green: #4ade80;
  --red: #f87171;
  --yellow: #fbbf24;
  --orange: #fb923c;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
button { cursor: pointer; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; font-family: inherit; }
input { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
input:focus { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { opacity: 0.9; }
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* Login */
#login { display: flex; align-items: center; justify-content: center; height: 100vh; }
.login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 380px; text-align: center; }
.login-box h1 { font-size: 20px; margin-bottom: 8px; }
.login-box p { color: var(--text-dim); margin-bottom: 24px; font-size: 13px; }
.login-box input { width: 100%; margin-bottom: 16px; }
.login-box button { width: 100%; padding: 10px; }
.login-error { color: var(--red); font-size: 12px; margin-top: 8px; }

/* App layout — full viewport, no scroll */
#app { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
.topbar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
.topbar h1 { font-size: 16px; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.role-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--surface2); color: var(--text-dim); }

/* List */
.list-container { flex: 1; overflow-y: auto; max-width: 1100px; margin: 0 auto; padding: 20px; width: 100%; }
.list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.list-header h2 { font-size: 18px; }
.list-stats { color: var(--text-dim); font-size: 13px; }
.conv-table { width: 100%; border-collapse: collapse; }
.conv-table th { text-align: left; padding: 8px 12px; color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
.conv-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.conv-table tr { cursor: pointer; transition: background 0.15s; }
.conv-table tbody tr:hover { background: var(--surface); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-running { background: var(--green); }
.status-prepared { background: var(--text-dim); }
.status-starting { background: var(--yellow); }
.status-error { background: var(--red); }
.status-stopped { background: var(--orange); }
.status-restarting { background: var(--yellow); }
.status-destroyed { background: var(--red); opacity: 0.5; }

/* Detail — full viewport, no scroll */
.detail-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.detail-header { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
.detail-header .back { color: var(--accent); cursor: pointer; font-size: 18px; }
.detail-header .title { font-size: 16px; font-weight: 600; }
.detail-badges { display: flex; gap: 6px; flex: 1; }
.detail-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.badge-status { font-weight: 600; }
.badge-agent { background: rgba(108,140,255,0.15); color: var(--accent); }
.badge-model { background: var(--surface2); color: var(--text-dim); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; }
.detail-actions { display: flex; gap: 6px; }
.detail-body { flex: 1; display: grid; grid-template-columns: 320px 1fr; gap: 12px; padding: 12px; overflow: hidden; min-height: 0; }

/* Events panel */
.events-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.events-panel h3 { flex-shrink: 0; padding: 10px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.events-list { flex: 1; overflow-y: auto; padding: 6px 0; min-height: 0; }
.event-item { padding: 5px 14px; font-size: 11px; font-family: 'SF Mono', 'Fira Code', monospace; display: flex; gap: 8px; line-height: 1.5; }
.event-item:hover { background: var(--surface2); }
.event-time { color: var(--text-dim); white-space: nowrap; }
.event-type { color: var(--accent); white-space: nowrap; }
.event-payload { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }

/* Messages panel */
.messages-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.messages-panel h3 { flex-shrink: 0; padding: 10px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.messages-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

/* Bubble base */
.msg { display: flex; }
.msg.assistant, .msg.tool { justify-content: flex-start; }
.msg.user { justify-content: flex-end; }
.msg.system { justify-content: center; }

.msg-bubble { max-width: 75%; border-radius: 12px; padding: 10px 14px; }
.msg.user .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant .msg-bubble { background: var(--surface2); color: var(--text); border-bottom-left-radius: 4px; }
.msg.tool .msg-bubble { background: var(--surface2); color: var(--text); border-bottom-left-radius: 4px; }
.msg.system .msg-bubble { background: transparent; color: var(--text-dim); font-style: italic; font-size: 12px; padding: 4px 12px; }

.msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 12px; }
.msg-role { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
.msg-role.user { color: #fff; }
.msg-role.assistant { color: var(--green); }
.msg-role.tool { color: var(--orange); }
.msg-time { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
.msg.user .msg-time { color: rgba(255,255,255,0.6); }

.msg-meta { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
.msg-meta-tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); font-family: 'SF Mono', 'Fira Code', monospace; }
.msg.user .msg-meta-tag { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); }
.msg-meta-tag.model { background: rgba(0,0,0,0.2); color: rgba(255,255,255,0.55); }

.msg-content { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

/* Thinking animation */
@keyframes thinkPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
.msg-thinking .msg-content { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
.think-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: thinkPulse 1.4s infinite; }
.think-dot:nth-child(2) { animation-delay: 0.2s; }
.think-dot:nth-child(3) { animation-delay: 0.4s; }

/* Tool card */
.tool-card { margin-top: 8px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.tool-card-header { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--bg); cursor: pointer; font-size: 12px; font-family: 'SF Mono', 'Fira Code', monospace; user-select: none; }
.tool-card-header:hover { background: var(--surface2); }
.tool-icon { color: var(--orange); font-size: 10px; transition: transform 0.15s; }
.tool-card-header.expanded .tool-icon { transform: rotate(90deg); }
.tool-card-name { color: var(--orange); flex: 1; }
.tool-toggle { color: var(--text-dim); font-size: 10px; }
.tool-card-body { display: none; padding: 8px 10px; background: var(--bg); border-top: 1px solid var(--border); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; color: var(--text-dim); white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
.tool-card-body.show { display: block; }

/* Tool result inside bubble */
.tool-result { margin-top: 6px; padding: 6px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; color: var(--text-dim); white-space: pre-wrap; max-height: 120px; overflow-y: auto; }

.empty-state { text-align: center; color: var(--text-dim); padding: 40px; font-size: 13px; }
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <div class="login-box">
    <h1>AgentOrchestrator</h1>
    <p>Enter your API key to access the dashboard</p>
    <input id="apiKeyInput" type="password" placeholder="API Key" autofocus>
    <button class="btn-primary" onclick="doLogin()">Login</button>
    <div id="loginError" class="login-error" style="display:none"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="topbar">
    <h1>AgentOrchestrator</h1>
    <div class="topbar-right">
      <span id="roleBadge" class="role-badge"></span>
      <button class="btn-ghost btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <!-- List View -->
  <div id="listView" class="list-container">
    <div class="list-header">
      <h2>Conversations</h2>
      <span id="listStats" class="list-stats"></span>
    </div>
    <table class="conv-table">
      <thead>
        <tr><th>ID</th><th>Status</th><th>Port</th><th>Agent</th><th>Model</th><th>Age</th></tr>
      </thead>
      <tbody id="convList"></tbody>
    </table>
    <div id="listEmpty" class="empty-state" style="display:none">No conversations yet. Create one via the API.</div>
  </div>

  <!-- Detail View -->
  <div id="detailView" class="detail-view" style="display:none">
    <div class="detail-header">
      <span class="back" onclick="showList()">&larr;</span>
      <span id="detailTitle" class="title"></span>
      <div class="detail-badges">
        <span id="detailStatus" class="detail-badge badge-status"></span>
        <span id="detailAgent" class="detail-badge badge-agent" style="display:none"></span>
        <span id="detailModel" class="detail-badge badge-model" style="display:none"></span>
      </div>
      <div id="detailActions" class="detail-actions"></div>
    </div>
    <div class="detail-body">
      <div class="events-panel">
        <h3>Events</h3>
        <div id="eventsList" class="events-list"></div>
      </div>
      <div class="messages-panel">
        <h3>Messages</h3>
        <div id="messagesList" class="messages-list">
          <div class="empty-state">No messages yet</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = {
  key: '',
  role: 'admin',
  async fetch(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { 'Authorization': `Bearer ${this.key}`, 'Content-Type': 'application/json', ...opts.headers }
    });
    if (res.status === 401) { this.logout(); throw new Error('Unauthorized'); }
    return res;
  },
  async get(path) { return (await this.fetch(path)).json(); },
  async post(path, body) { return (await this.fetch(path, { method: 'POST', body: JSON.stringify(body) })).json(); },
  async del(path) { return (await this.fetch(path, { method: 'DELETE' })).json(); },
  async rawPost(path, body) { return this.fetch(path, { method: 'POST', body: JSON.stringify(body) }); },
  async rawDel(path) { return this.fetch(path, { method: 'DELETE' }); },
  logout() { this.key = ''; sessionStorage.removeItem('ao_key'); showLogin(); }
};

let currentConv = null;
let ws = null;
let pollTimer = null;
let thinkingState = null;
let userMessageMeta = {};

function showLogin() {
  document.getElementById('login').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  disconnectWS();
  clearInterval(pollTimer);
}

function showApp() {
  document.getElementById('login').style.display = 'none';
  const app = document.getElementById('app');
  app.style.display = 'flex';
  document.getElementById('roleBadge').textContent = API.role;
  document.getElementById('detailActions').style.display = API.role !== 'observer' ? 'flex' : 'none';
  showList();
}

function showList() {
  currentConv = null;
  thinkingState = null;
  userMessageMeta = {};
  document.getElementById('listView').style.display = 'block';
  document.getElementById('detailView').style.display = 'none';
  disconnectWS();
  loadConversations();
  clearInterval(pollTimer);
  pollTimer = setInterval(loadConversations, 5000);
}

async function doLogin() {
  const input = document.getElementById('apiKeyInput');
  const key = input.value.trim();
  if (!key) return;
  const errEl = document.getElementById('loginError');
  try {
    API.key = key;
    const res = await fetch('/api/auth/role', { headers: { 'Authorization': `Bearer ${key}` } });
    if (!res.ok) throw new Error('Invalid key');
    const data = await res.json();
    API.role = data.role || 'admin';
    sessionStorage.setItem('ao_key', key);
    showApp();
  } catch (e) {
    errEl.textContent = 'Invalid API key';
    errEl.style.display = 'block';
    API.key = '';
  }
}

function doLogout() { API.logout(); }

function age(ts) {
  const ms = Date.now() - ts;
  if (ms < 60000) return Math.floor(ms / 1000) + 's';
  if (ms < 3600000) return Math.floor(ms / 60000) + 'm';
  if (ms < 86400000) return Math.floor(ms / 3600000) + 'h';
  return Math.floor(ms / 86400000) + 'd';
}

function timeStr(ts) {
  return new Date(ts).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function loadConversations() {
  try {
    const data = await API.get('/api/conversations');
    const list = Array.isArray(data) ? data : [];
    const tbody = document.getElementById('convList');
    const empty = document.getElementById('listEmpty');
    if (list.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      document.getElementById('listStats').textContent = '';
      return;
    }
    empty.style.display = 'none';
    const active = list.filter(c => c.status === 'running').length;
    const errors = list.filter(c => c.status === 'error').length;
    document.getElementById('listStats').textContent = `Active: ${active} | Total: ${list.length} | Errors: ${errors}`;
    tbody.innerHTML = list.map(c => `
      <tr onclick="openDetail('${c.id}')">
        <td>${c.id}</td>
        <td><span class="status-dot status-${c.status}"></span>${c.status}</td>
        <td>${c.port ?? '-'}</td>
        <td>${c.lastAgent || c.agentType || '-'}</td>
        <td style="font-family:monospace;font-size:12px;color:var(--text-dim)">${c.lastModel || '-'}</td>
        <td>${age(c.createdAt)}</td>
      </tr>
    `).join('');
  } catch (e) { /* ignore */ }
}

async function openDetail(id) {
  currentConv = id;
  thinkingState = null;
  clearInterval(pollTimer);
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').style.display = 'flex';
  document.getElementById('detailTitle').textContent = id;
  document.getElementById('detailActions').innerHTML = API.role !== 'observer'
    ? `<button class="btn-ghost btn-sm" onclick="convAction('${id}','stop')">Stop</button>
       <button class="btn-ghost btn-sm" onclick="convAction('${id}','restart')">Restart</button>
       <button class="btn-danger btn-sm" onclick="convAction('${id}','delete')">Delete</button>`
    : '';
  loadDetail(id);
  connectWS(id);
}

async function loadDetail(id) {
  try {
    const status = await API.get(`/api/conversations/${id}`);
    const statusEl = document.getElementById('detailStatus');
    statusEl.textContent = status.status;
    statusEl.className = `detail-badge badge-status status-${status.status}`;

    const agentEl = document.getElementById('detailAgent');
    const agentLabel = status.lastAgent || status.agentType;
    if (agentLabel) {
      agentEl.textContent = agentLabel;
      agentEl.style.display = '';
    } else {
      agentEl.style.display = 'none';
    }

    const modelEl = document.getElementById('detailModel');
    if (status.lastModel) {
      modelEl.textContent = status.lastModel;
      modelEl.style.display = '';
    } else {
      modelEl.style.display = 'none';
    }
  } catch (e) { /* ignore */ }
  loadEvents(id);
  loadMessages(id);
}

async function loadEvents(id) {
  try {
    const events = await API.get(`/api/conversations/${id}/events?limit=50`);
    const el = document.getElementById('eventsList');
    if (!events || events.length === 0) { el.innerHTML = '<div class="empty-state">No events yet</div>'; return; }
    el.innerHTML = events.map(e => `
      <div class="event-item">
        <span class="event-time">${timeStr(e.timestamp)}</span>
        <span class="event-type">${e.type}</span>
        <span class="event-payload" title="${escHtml(JSON.stringify(e.payload || {}))}">${summarizePayload(e.payload)}</span>
      </div>
    `).join('');
    el.scrollTop = el.scrollHeight;
  } catch (e) { /* ignore */ }
}

async function loadMessages(id) {
  try {
    const status = await API.get(`/api/conversations/${id}`);
    if (!status.sessionId) {
      if (thinkingState) renderMessages([]);
      return;
    }
    const msgs = await API.get(`/api/conversations/${id}/sessions/${status.sessionId}/messages?limit=50`);
    renderMessages(msgs);
  } catch (e) { /* ignore */ }
}

function renderMessages(msgs) {
  const el = document.getElementById('messagesList');
  const hasReal = msgs && msgs.length > 0;
  const hasThinking = thinkingState !== null;

  if (!hasReal && !hasThinking) {
    el.innerHTML = '<div class="empty-state">No messages yet</div>';
    return;
  }

  let html = '';

  if (hasReal) {
    html += msgs.map(m => {
      const role = m.info?.role || 'unknown';
      const ts = m.info?.created_at ? timeStr(m.info.created_at) : '';
      const parts = (m.parts || []).map(p => {
        if (p.type === 'text') return `<div class="msg-content">${escHtml(p.text || '')}</div>`;
        if (p.type === 'tool_call') {
          const argsStr = JSON.stringify(p.args || {}, null, 2);
          const tcId = 'tc_' + Math.random().toString(36).slice(2, 8);
          return `<div class="tool-card"><div class="tool-card-header" onclick="toggleToolDetail('${tcId}')"><span class="tool-icon">▶</span><span class="tool-card-name">Tool: ${escHtml(p.tool || 'unknown')}</span><span class="tool-toggle">▸</span></div><div class="tool-card-body" id="${tcId}">${escHtml(argsStr)}</div></div>`;
        }
        if (p.type === 'tool_result') {
          const out = String(p.output || p.content || '').slice(0, 500);
          return `<div class="tool-result">${escHtml(out)}</div>`;
        }
        return '';
      }).join('');

      let metaHtml = '';
      if (role === 'user') {
        const msgText = (m.parts || []).filter(p => p.type === 'text').map(p => p.text || '').join('');
        const meta = userMessageMeta[msgText];
        if (meta && (meta.agent || meta.model)) {
          const tags = [];
          if (meta.agent) tags.push(`<span class="msg-meta-tag">${escHtml(meta.agent)}</span>`);
          if (meta.model) tags.push(`<span class="msg-meta-tag model">${escHtml(meta.model)}</span>`);
          metaHtml = `<div class="msg-meta">${tags.join('')}</div>`;
        }
      }

      return `<div class="msg ${role}"><div class="msg-bubble"><div class="msg-header"><span class="msg-role ${role}">${escHtml(role)}</span><span class="msg-time">${ts}</span></div>${metaHtml}${parts}</div></div>`;
    }).join('');
  }

  if (hasThinking) {
    const t = thinkingState;
    const lastUserText = hasReal ? (() => {
      for (let i = msgs.length - 1; i >= 0; i--) {
        if (msgs[i].info?.role === 'user') {
          return (msgs[i].parts || []).filter(p => p.type === 'text').map(p => p.text || '').join('');
        }
      }
      return '';
    })() : '';
    const userAlreadyRendered = hasReal && lastUserText === t.text;

    if (!userAlreadyRendered) {
      let metaHtml = '';
      if (t.agent || t.model) {
        const tags = [];
        if (t.agent) tags.push(`<span class="msg-meta-tag">${escHtml(t.agent)}</span>`);
        if (t.model) tags.push(`<span class="msg-meta-tag model">${escHtml(t.model)}</span>`);
        metaHtml = `<div class="msg-meta">${tags.join('')}</div>`;
      }
      html += `<div class="msg user"><div class="msg-bubble"><div class="msg-header"><span class="msg-role user">user</span><span class="msg-time">${timeStr(t.timestamp)}</span></div>${metaHtml}<div class="msg-content">${escHtml(t.text)}</div></div></div>`;
    }
    html += `<div class="msg assistant msg-thinking"><div class="msg-bubble"><div class="msg-header"><span class="msg-role assistant">assistant</span></div><div class="msg-content"><span class="think-dot"></span><span class="think-dot"></span><span class="think-dot"></span></div></div></div>`;
  }

  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;

  if (hasReal && hasThinking && msgs.some(m => m.info?.role === 'assistant')) {
    thinkingState = null;
    renderMessages(msgs);
    return;
  }
}

function toggleToolDetail(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const hdr = el.previousElementSibling;
  el.classList.toggle('show');
  if (hdr) hdr.classList.toggle('expanded');
}

function summarizePayload(p) {
  if (!p) return '';
  if (p.status) return p.status;
  if (p.messageId) return 'msg:' + String(p.messageId).slice(0, 8);
  return '';
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function convAction(id, action) {
  if (action === 'delete') { if (!confirm(`Delete conversation ${id}?`)) return; }
  const btns = document.querySelectorAll('#detailActions button');
  btns.forEach(b => { b.disabled = true; b.dataset.origText = b.textContent; b.textContent = action === 'stop' ? 'Stopping…' : action === 'restart' ? 'Restarting…' : 'Deleting…'; });
  try {
    let res;
    if (action === 'delete') {
      res = await API.rawDel(`/api/conversations/${id}`);
    } else {
      res = await API.rawPost(`/api/conversations/${id}/${action}`, {});
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body?.error?.message || `HTTP ${res.status}`);
    }
    if (action === 'delete') { showList(); return; }
    setTimeout(() => loadDetail(id), 500);
  } catch (e) {
    alert(`Failed: ${e.message}`);
  } finally {
    btns.forEach(b => { b.disabled = false; b.textContent = b.dataset.origText; });
  }
}

// WebSocket
function connectWS(id) {
  disconnectWS();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws/${id}?apiKey=${encodeURIComponent(API.key)}`;
  ws = new WebSocket(url);
  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.method === 'conversation.destroyed') { setTimeout(showList, 2000); return; }
      if (msg.method === 'conversation.thinking') {
        const t = { text: msg.params?.text || '', model: msg.params?.model, agent: msg.params?.agent, timestamp: Date.now() };
        thinkingState = t;
        if (t.text && (t.agent || t.model)) userMessageMeta[t.text] = { agent: t.agent, model: t.model };
        renderMessages([]);
        loadEvents(id);
        return;
      }
      if (msg.method === 'opencode.message.updated') {
        thinkingState = null;
        loadMessages(id);
        loadEvents(id);
        loadDetail(id);
        return;
      }
      if (msg.method?.startsWith('conversation.') || msg.method?.startsWith('opencode.')) {
        loadEvents(id);
      }
      if (msg.method?.startsWith('conversation.')) { loadDetail(id); }
    } catch (e) { /* ignore */ }
  };
  ws.onclose = () => { ws = null; };
  ws.onerror = () => { ws = null; };
}

function disconnectWS() { if (ws) { ws.close(); ws = null; } }

// Init
(function init() {
  const saved = sessionStorage.getItem('ao_key');
  if (saved) { API.key = saved; fetch('/api/auth/role', { headers: { 'Authorization': `Bearer ${saved}` } }).then(r => { if (r.ok) return r.json(); throw new Error(); }).then(d => { API.role = d.role || 'admin'; showApp(); }).catch(() => { sessionStorage.removeItem('ao_key'); showLogin(); }); }
  document.getElementById('apiKeyInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
})();
</script>
