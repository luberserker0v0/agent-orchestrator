<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentOrchestrator Dashboard</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3345;
  --text: #e4e6f0;
  --text-dim: #8b8fa3;
  --accent: #6c8cff;
  --green: #4ade80;
  --red: #f87171;
  --yellow: #fbbf24;
  --orange: #fb923c;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
button { cursor: pointer; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; font-family: inherit; }
input { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
input:focus { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { opacity: 0.9; }
.btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* Login */
#login { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 380px; text-align: center; }
.login-box h1 { font-size: 20px; margin-bottom: 8px; }
.login-box p { color: var(--text-dim); margin-bottom: 24px; font-size: 13px; }
.login-box input { width: 100%; margin-bottom: 16px; }
.login-box button { width: 100%; padding: 10px; }
.login-error { color: var(--red); font-size: 12px; margin-top: 8px; }

/* Layout */
#app { display: none; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
.topbar h1 { font-size: 16px; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.role-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--surface2); color: var(--text-dim); }

/* List */
.list-container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
.list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.list-header h2 { font-size: 18px; }
.list-stats { color: var(--text-dim); font-size: 13px; }
.conv-table { width: 100%; border-collapse: collapse; }
.conv-table th { text-align: left; padding: 8px 12px; color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
.conv-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.conv-table tr { cursor: pointer; transition: background 0.15s; }
.conv-table tbody tr:hover { background: var(--surface); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-running { background: var(--green); }
.status-prepared { background: var(--text-dim); }
.status-starting { background: var(--yellow); }
.status-error { background: var(--red); }
.status-stopped { background: var(--orange); }
.status-restarting { background: var(--yellow); }
.status-destroyed { background: var(--red); opacity: 0.5; }

/* Detail */
.detail-container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.detail-header { display: flex; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.detail-header .back { color: var(--accent); cursor: pointer; font-size: 18px; }
.detail-header .title { font-size: 18px; font-weight: 600; flex: 1; }
.detail-actions { display: flex; gap: 8px; }
.detail-body { display: grid; grid-template-columns: 320px 1fr; gap: 16px; min-height: calc(100vh - 140px); }

/* Events panel */
.events-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.events-panel h3 { padding: 12px 16px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.events-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.event-item { padding: 6px 16px; font-size: 12px; font-family: 'SF Mono', 'Fira Code', monospace; display: flex; gap: 8px; line-height: 1.5; }
.event-item:hover { background: var(--surface2); }
.event-time { color: var(--text-dim); white-space: nowrap; }
.event-type { color: var(--accent); white-space: nowrap; }
.event-payload { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }

/* Messages panel */
.messages-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.messages-panel h3 { padding: 12px 16px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.messages-list { flex: 1; overflow-y: auto; padding: 16px; }
.msg { margin-bottom: 16px; }
.msg-role { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 600; }
.msg-role.user { color: var(--accent); }
.msg-role.assistant { color: var(--green); }
.msg-role.system { color: var(--yellow); }
.msg-role.tool { color: var(--orange); }
.msg-content { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg-parts { margin-top: 4px; }
.tool-call { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; margin-top: 6px; font-size: 12px; font-family: 'SF Mono', 'Fira Code', monospace; }
.tool-call-header { color: var(--orange); margin-bottom: 4px; }
.tool-call-body { color: var(--text-dim); white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
.empty-state { text-align: center; color: var(--text-dim); padding: 40px; font-size: 13px; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text-dim); }
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <div class="login-box">
    <h1>AgentOrchestrator</h1>
    <p>Enter your API key to access the dashboard</p>
    <input id="apiKeyInput" type="password" placeholder="API Key" autofocus>
    <button class="btn-primary" onclick="doLogin()">Login</button>
    <div id="loginError" class="login-error" style="display:none"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="topbar">
    <h1>AgentOrchestrator</h1>
    <div class="topbar-right">
      <span id="roleBadge" class="role-badge"></span>
      <button class="btn-ghost btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <!-- List View -->
  <div id="listView" class="list-container">
    <div class="list-header">
      <h2>Conversations</h2>
      <span id="listStats" class="list-stats"></span>
    </div>
    <table class="conv-table">
      <thead>
        <tr><th>ID</th><th>Status</th><th>Port</th><th>Agent</th><th>Session</th><th>Age</th></tr>
      </thead>
      <tbody id="convList"></tbody>
    </table>
    <div id="listEmpty" class="empty-state" style="display:none">No conversations yet. Create one via the API.</div>
  </div>

  <!-- Detail View -->
  <div id="detailView" class="detail-container" style="display:none">
    <div class="detail-header">
      <span class="back" onclick="showList()">&larr;</span>
      <span id="detailTitle" class="title"></span>
      <span id="detailStatus" class="role-badge"></span>
      <div id="detailActions" class="detail-actions"></div>
    </div>
    <div class="detail-body">
      <div class="events-panel">
        <h3>Events</h3>
        <div id="eventsList" class="events-list"></div>
      </div>
      <div class="messages-panel">
        <h3>Messages</h3>
        <div id="messagesList" class="messages-list">
          <div class="empty-state">No messages yet</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = {
  key: '',
  role: 'admin',
  async fetch(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { 'Authorization': `Bearer ${this.key}`, 'Content-Type': 'application/json', ...opts.headers }
    });
    if (res.status === 401) { this.logout(); throw new Error('Unauthorized'); }
    return res;
  },
  async get(path) { return (await this.fetch(path)).json(); },
  async post(path, body) { return (await this.fetch(path, { method: 'POST', body: JSON.stringify(body) })).json(); },
  async del(path) { return (await this.fetch(path, { method: 'DELETE' })).json(); },
  logout() { this.key = ''; sessionStorage.removeItem('ao_key'); showLogin(); }
};

let currentConv = null;
let ws = null;
let pollTimer = null;

function showLogin() {
  document.getElementById('login').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  disconnectWS();
  clearInterval(pollTimer);
}

function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('roleBadge').textContent = API.role;
  document.getElementById('detailActions').style.display = API.role !== 'observer' ? 'flex' : 'none';
  showList();
}

function showList() {
  currentConv = null;
  document.getElementById('listView').style.display = 'block';
  document.getElementById('detailView').style.display = 'none';
  disconnectWS();
  loadConversations();
  clearInterval(pollTimer);
  pollTimer = setInterval(loadConversations, 5000);
}

async function doLogin() {
  const input = document.getElementById('apiKeyInput');
  const key = input.value.trim();
  if (!key) return;
  const errEl = document.getElementById('loginError');
  try {
    API.key = key;
    const res = await fetch('/api/auth/role', { headers: { 'Authorization': `Bearer ${key}` } });
    if (!res.ok) throw new Error('Invalid key');
    const data = await res.json();
    API.role = data.role || 'admin';
    sessionStorage.setItem('ao_key', key);
    showApp();
  } catch (e) {
    errEl.textContent = 'Invalid API key';
    errEl.style.display = 'block';
    API.key = '';
  }
}

function doLogout() { API.logout(); }

function age(ts) {
  const ms = Date.now() - ts;
  if (ms < 60000) return Math.floor(ms / 1000) + 's';
  if (ms < 3600000) return Math.floor(ms / 60000) + 'm';
  if (ms < 86400000) return Math.floor(ms / 3600000) + 'h';
  return Math.floor(ms / 86400000) + 'd';
}

function timeStr(ts) {
  return new Date(ts).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function loadConversations() {
  try {
    const data = await API.get('/api/conversations');
    const list = Array.isArray(data) ? data : [];
    const tbody = document.getElementById('convList');
    const empty = document.getElementById('listEmpty');
    if (list.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      document.getElementById('listStats').textContent = '';
      return;
    }
    empty.style.display = 'none';
    const active = list.filter(c => c.status === 'running').length;
    const errors = list.filter(c => c.status === 'error').length;
    document.getElementById('listStats').textContent = `Active: ${active} | Total: ${list.length} | Errors: ${errors}`;
    tbody.innerHTML = list.map(c => `
      <tr onclick="openDetail('${c.id}')">
        <td>${c.id}</td>
        <td><span class="status-dot status-${c.status}"></span>${c.status}</td>
        <td>${c.port ?? '-'}</td>
        <td>${c.agentType ?? '-'}</td>
        <td style="font-family:monospace;font-size:12px;color:var(--text-dim)">${c.sessionId ? c.sessionId.slice(0, 8) + '...' : '-'}</td>
        <td>${age(c.createdAt)}</td>
      </tr>
    `).join('');
  } catch (e) { /* ignore */ }
}

async function openDetail(id) {
  currentConv = id;
  clearInterval(pollTimer);
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';
  document.getElementById('detailTitle').textContent = id;
  document.getElementById('detailActions').innerHTML = API.role !== 'observer'
    ? `<button class="btn-ghost btn-sm" onclick="convAction('${id}','stop')">Stop</button>
       <button class="btn-ghost btn-sm" onclick="convAction('${id}','restart')">Restart</button>
       <button class="btn-danger btn-sm" onclick="convAction('${id}','delete')">Delete</button>`
    : '';
  loadDetail(id);
  connectWS(id);
}

async function loadDetail(id) {
  try {
    const status = await API.get(`/api/conversations/${id}`);
    document.getElementById('detailStatus').textContent = status.status;
    document.getElementById('detailStatus').className = `role-badge status-${status.status}`;
    document.getElementById('detailStatus').style.background = '';
  } catch (e) { /* ignore */ }
  loadEvents(id);
  loadMessages(id);
}

async function loadEvents(id) {
  try {
    const events = await API.get(`/api/conversations/${id}/events?limit=50`);
    const el = document.getElementById('eventsList');
    if (!events || events.length === 0) { el.innerHTML = '<div class="empty-state">No events yet</div>'; return; }
    el.innerHTML = events.map(e => `
      <div class="event-item">
        <span class="event-time">${timeStr(e.timestamp)}</span>
        <span class="event-type">${e.type}</span>
        <span class="event-payload" title="${escHtml(JSON.stringify(e.payload || {}))}">${summarizePayload(e.payload)}</span>
      </div>
    `).join('');
    el.scrollTop = el.scrollHeight;
  } catch (e) { /* ignore */ }
}

async function loadMessages(id) {
  try {
    const status = await API.get(`/api/conversations/${id}`);
    if (!status.sessionId) { return; }
    const msgs = await API.get(`/api/conversations/${id}/sessions/${status.sessionId}/messages?limit=50`);
    renderMessages(msgs);
  } catch (e) { /* ignore */ }
}

function renderMessages(msgs) {
  const el = document.getElementById('messagesList');
  if (!msgs || msgs.length === 0) { el.innerHTML = '<div class="empty-state">No messages yet</div>'; return; }
  el.innerHTML = msgs.map(m => {
    const role = m.info?.role || 'unknown';
    const parts = (m.parts || []).map(p => {
      if (p.type === 'text') return `<div class="msg-content">${escHtml(p.text || '')}</div>`;
      if (p.type === 'tool_call') return `<div class="tool-call"><div class="tool-call-header">Tool Call: ${escHtml(p.tool || '')}</div><div class="tool-call-body">${escHtml(JSON.stringify(p.args || {}, null, 2))}</div></div>`;
      if (p.type === 'tool_result') return `<div class="tool-call"><div class="tool-call-header">Tool Result</div><div class="tool-call-body">${escHtml(String(p.output || p.content || '').slice(0, 500))}</div></div>`;
      return `<div class="msg-content">${escHtml(JSON.stringify(p))}</div>`;
    }).join('');
    return `<div class="msg"><div class="msg-role ${role}">${role}</div><div class="msg-parts">${parts}</div></div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function summarizePayload(p) {
  if (!p) return '';
  if (p.status) return p.status;
  if (p.messageId) return 'msg:' + String(p.messageId).slice(0, 8);
  return '';
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function convAction(id, action) {
  try {
    if (action === 'delete') { if (!confirm(`Delete conversation ${id}?`)) return; }
    await API.post(`/api/conversations/${id}/${action}`, {});
    if (action === 'delete') { showList(); } else { setTimeout(() => loadDetail(id), 500); }
  } catch (e) { alert(`Failed: ${e.message}`); }
}

// WebSocket
function connectWS(id) {
  disconnectWS();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws/${id}?apiKey=${encodeURIComponent(API.key)}`;
  ws = new WebSocket(url);
  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.method === 'conversation.destroyed') { setTimeout(showList, 2000); return; }
      if (msg.method?.startsWith('conversation.') || msg.method?.startsWith('opencode.')) {
        loadEvents(id);
      }
      if (msg.method === 'opencode.message.updated') { loadMessages(id); }
      if (msg.method?.startsWith('conversation.')) { loadDetail(id); }
    } catch (e) { /* ignore */ }
  };
  ws.onclose = () => { ws = null; };
  ws.onerror = () => { ws = null; };
}

function disconnectWS() { if (ws) { ws.close(); ws = null; } }

// Init
(function init() {
  const saved = sessionStorage.getItem('ao_key');
  if (saved) { API.key = saved; fetch('/api/auth/role', { headers: { 'Authorization': `Bearer ${saved}` } }).then(r => { if (r.ok) return r.json(); throw new Error(); }).then(d => { API.role = d.role || 'admin'; showApp(); }).catch(() => { sessionStorage.removeItem('ao_key'); showLogin(); }); }
  document.getElementById('apiKeyInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
})();
</script>
</body>
</html>
